<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://t1.kakaocdn.net 'sha256-LROazNXqrK5398yXqn1/djuU9rX78bMo1SSSFVEnxRY='; frame-src https://postcode.map.kakao.com; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>국내 주소검색</title>
<style>html,body,#postcode{margin:0;width:100%;height:100%;background:#fff}#message{padding:12px;font:14px system-ui,sans-serif}
#result{box-sizing:border-box;max-width:520px;margin:20px auto;padding:16px;font:16px system-ui,sans-serif}
#result h1{font-size:20px}#selectedAddress{box-sizing:border-box;width:100%;padding:10px;font:inherit}
#copyAddress{padding:8px 14px;margin-top:10px;font:inherit}
</style>
</head>
<body>
<div id="postcode"><p id="message" role="status">주소검색을 불러오는 중입니다.</p></div>
<main id="result" hidden>
 <h1>선택한 주소</h1>
 <input id="selectedAddress" aria-label="선택한 주소" readonly>
 <button id="copyAddress" type="button">주소 복사</button>
 <p id="copyStatus" role="status">주소를 복사한 뒤 상속포탈로 돌아가 주소칸에 붙여넣으세요.</p>
</main>
<script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" integrity="sha384-HinPpmc1kpW8Z7/w1AbyzfnSjWYE5IGUEiQ/5F4s61Zudq2H9SCQLr4WLaXGqXJ9" crossorigin="anonymous"></script>
<script>
'use strict';
const container=document.getElementById('postcode');
const embedded=parent!==window;
const receiver=embedded?parent:window.opener;
const addressField=document.getElementById('selectedAddress');
const copyStatus=document.getElementById('copyStatus');
const portalOrigin='https://rokmc718kr-droid.github.io';
let returnOrigin=embedded?portalOrigin:null;
const report=(type,address)=>{
 if(type==='selected'&&!returnOrigin)return;
 receiver?.postMessage({channel:'c7-address-search',type,address},returnOrigin==='null'||!returnOrigin?'*':returnOrigin);
};
document.getElementById('copyAddress').addEventListener('click',async()=>{
 try{
  await navigator.clipboard.writeText(addressField.value);
  copyStatus.textContent='주소를 복사했습니다. 상속포탈로 돌아가 주소칸에 붙여넣으세요.';
 }catch{
  addressField.focus();
  addressField.select();
  copyStatus.textContent='선택한 주소를 길게 눌러 복사한 뒤 상속포탈에 붙여넣으세요.';
 }
});
window.addEventListener('message',e=>{
 if(embedded||!receiver||e.source!==receiver||e.data?.channel!=='c7-address-search')return;
 if(e.data.type==='init'&&(e.origin===portalOrigin||e.origin==='null'))returnOrigin=e.origin;
 if(e.data.type==='applied'&&returnOrigin&&e.origin===returnOrigin){
  copyStatus.textContent='상속포탈 주소칸에 입력했습니다. 상속포탈 탭으로 돌아가세요.';
  window.close();
 }
});
try{
 if(!window.kakao?.Postcode)throw new Error('주소검색 연결 실패');
 container.replaceChildren();
 new kakao.Postcode({
  width:'100%',height:'100%',
  onresize:()=>report('ready'),
  oncomplete:data=>{
   const address=data.address;
   if(typeof address!=='string'||!address.trim())return;
   if(!embedded){
    addressField.value=address.trim();
    container.hidden=true;
    document.getElementById('result').hidden=false;
   }
   report('selected',address.trim());
  }
 }).embed(container);
}catch{
 container.textContent='주소검색에 연결하지 못했습니다. 검색창을 닫고 직접 입력해 주세요.';
 report('unavailable');
}
</script>
</body>
</html>
